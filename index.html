<style>
  :root{--paper:#f4f1ea;--ink:#22252b;--soft:#5c5e63;--wine:#6e1423;--wine-deep:#4a0d18;--line:#ddd7c9}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;
    align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
  .box{width:100%;max-width:340px;background:#fbf9f5;border:1px solid var(--line);border-radius:16px;
    padding:28px 24px 22px;box-shadow:0 10px 30px rgba(74,13,24,.08)}
  .k{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soft)}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:24px;color:var(--wine-deep);margin:4px 0 18px;line-height:1.15}
  label{font-size:12.5px;color:var(--soft);display:block;margin-bottom:6px}
  input[type=password]{width:100%;font-size:18px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);outline:none;font-family:inherit;letter-spacing:2px}
  input[type=password]:focus{border-color:var(--wine);box-shadow:0 0 0 3px rgba(110,20,35,.12)}
  .rm{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:var(--ink)}
  .rm input{width:18px;height:18px;accent-color:var(--wine)}
  button{width:100%;border:0;border-radius:10px;background:var(--wine);color:#fff;font-family:inherit;
    font-size:15px;font-weight:600;padding:13px;cursor:pointer}
  button:disabled{opacity:.6}
  .err{min-height:18px;margin-top:10px;font-size:12.5px;color:#b91c1c;text-align:center}
</style>
</head>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='mosnel-mappa-key-'+P.salt.slice(0,8);
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub(P.salt),iterations:P.it},base,256));
}
async function dec(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct)));
}
function show(html){document.open();document.write(html);document.close();}
(async()=>{let s=null;try{s=localStorage.getItem(K);}catch(e){}
  if(s){try{show(await dec(ub(s)));return;}catch(e){try{localStorage.removeItem(K);}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
  const rem=document.getElementById('rem').checked;
  b.disabled=true;b.textContent='Apertura…';er.textContent='';
  let html;
  try{const raw=await derive(document.getElementById('pw').value);html=await dec(raw);
    if(rem){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}}
  }catch(x){er.textContent='Password non corretta.';b.disabled=false;b.textContent='Apri la mappa';return;}
  show(html);
});
